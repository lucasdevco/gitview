root = "."
tmp_dir = ".air"

[build]
cmd = "make build"
entrypoint = ["./gitview", "--help"]
include_ext = ["go", "ts", "tsx", "js", "jsx", "css", "html", "json"]
exclude_dir = [".air", ".git", "frontend/dist", "frontend/node_modules", "internal/web/dist"]
exclude_unchanged = true
delay = 2000
stop_on_error = true

[misc]
clean_on_exit = true
